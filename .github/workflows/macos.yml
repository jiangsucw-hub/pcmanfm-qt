name: Build macOS app

on:
  push:
    branches: [macos]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a GitHub release with the .dmg'
        type: boolean
        default: false

permissions:
  contents: write

env:
  DEPS: ${{ github.workspace }}/deps
  STAGE: ${{ github.workspace }}/stage

jobs:
  build:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - name: Checkout pcmanfm-qt
        uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          set -eux
          brew install cmake ninja pkg-config glib libexif gettext shared-mime-info
          pkg-config --modversion glib-2.0 gio-2.0
          # gettext is keg-only, but glib's gi18n-lib.h includes <libintl.h>
          GETTEXT_PREFIX="$(brew --prefix gettext)"
          echo "CFLAGS=-I$GETTEXT_PREFIX/include" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-I$GETTEXT_PREFIX/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$GETTEXT_PREFIX/lib -lintl" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          cache: true

      - name: Build lxqt-build-tools and lxqt-menu-data
        run: |
          set -eux
          mkdir -p "$DEPS"

          fetch() {
            curl -fsSL "https://github.com/lxqt/$1/archive/refs/tags/2.4.0.tar.gz" -o "/tmp/$1.tar.gz"
            rm -rf "/tmp/$1" && mkdir -p "/tmp/$1"
            tar xzf "/tmp/$1.tar.gz" -C "/tmp/$1" --strip-components=1
          }

          # lxqt-build-tools hardcodes /etc/xdg for menu files, which is not
          # writable on CI runners; point it into our staging prefix.
          fetch lxqt-build-tools
          cmake -S /tmp/lxqt-build-tools -B /tmp/lxqt-build-tools/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$DEPS" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DLXQT_ETC_XDG_DIR="$DEPS/etc/xdg"
          cmake --build /tmp/lxqt-build-tools/build --target install

          fetch lxqt-menu-data
          cmake -S /tmp/lxqt-menu-data -B /tmp/lxqt-menu-data/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$DEPS" \
            -DCMAKE_PREFIX_PATH="$DEPS;$QT_ROOT_DIR" \
            -DLXQT_ETC_XDG_DIR="$DEPS/etc/xdg"
          cmake --build /tmp/lxqt-menu-data/build --target install

      - name: Build libfm-qt
        run: |
          set -eux
          git clone --depth 1 --branch macos "https://github.com/${{ github.repository_owner }}/libfm-qt.git" /tmp/libfm-qt

          # lxqt's FindGLIB hard-requires a gio-unix include directory, which
          # Homebrew's glib does not ship on macOS (GLib implements GAppInfo
          # with NSWorkspace there). libfm-qt carries its own minimal
          # gdesktopappinfo shim, so point the variable at the glib headers.
          GLIB_INCLUDE_DIR="$(pkg-config --variable=includedir glib-2.0)/glib-2.0"
          test -d "$GLIB_INCLUDE_DIR/gio"
          echo "glib headers: $GLIB_INCLUDE_DIR"

          cmake -S /tmp/libfm-qt -B /tmp/libfm-qt/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$DEPS" \
            -DCMAKE_PREFIX_PATH="$DEPS;$QT_ROOT_DIR" \
            -DGLIB_GIO_UNIX_INCLUDE_DIR="$GLIB_INCLUDE_DIR"
          cmake --build /tmp/libfm-qt/build -j "$(sysctl -n hw.ncpu)"
          cmake --install /tmp/libfm-qt/build

      - name: Build pcmanfm-qt
        run: |
          set -eux
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig:$PKG_CONFIG_PATH"
          # libfm-qt is referenced as @rpath/libfm-qt6.x.dylib; macdeployqt can
          # only resolve that (and bundle it) if the binary carries an rpath
          # that points at the staged dependency directory.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$STAGE" \
            -DCMAKE_PREFIX_PATH="$DEPS;$QT_ROOT_DIR" \
            -DCMAKE_INSTALL_RPATH="$DEPS/lib"
          cmake --build build -j "$(sysctl -n hw.ncpu)"
          cmake --install build

      - name: Package .app and .dmg
        run: |
          set -eux
          APP="$(find "$STAGE" -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$APP"

          # ship translations and other data inside the bundle
          mkdir -p "$APP/Contents/Resources/share"
          if [ -d "$STAGE/share" ]; then
            cp -R "$STAGE/share/." "$APP/Contents/Resources/share/"
          fi
          if [ -d "$DEPS/share/libfm-qt" ]; then
            cp -R "$DEPS/share/libfm-qt" "$APP/Contents/Resources/share/"
          fi

          # bundle Qt, libfm-qt and every Homebrew dependency into Contents/Frameworks
          macdeployqt "$APP" \
            -libpath="$DEPS/lib" \
            -libpath="$(brew --prefix)/lib" \
            -always-overwrite \
            -verbose=1

          echo "== Contents/Frameworks =="
          ls -1 "$APP/Contents/Frameworks" | head -40
          test -e "$APP/Contents/Frameworks/libfm-qt6."*.dylib

          # the app must not depend on anything outside the bundle
          check_bundle() {
            local file="$1"
            local bad
            bad="$(otool -L "$file" | tail -n +2 | grep -E '/opt/homebrew|/Users/|'"${DEPS}"' || true)"
            if [ -n "$bad" ]; then
              echo "ERROR: $file still depends on unbundled libraries:"
              echo "$bad"
              exit 1
            fi
          }
          check_bundle "$APP/Contents/MacOS/pcmanfm-qt"
          for lib in "$APP/Contents/Frameworks/"*.dylib; do
            [ -e "$lib" ] && check_bundle "$lib"
          done

          macdeployqt "$APP" -dmg -always-overwrite -verbose=1
          DMG="$(find "$(dirname "$APP")" -maxdepth 1 -name '*.dmg' | head -n 1)"
          mv "$DMG" "PCManFM-Qt-${GITHUB_SHA::7}.dmg"
          ls -lh "PCManFM-Qt-${GITHUB_SHA::7}.dmg"
          otool -L "$APP/Contents/MacOS/pcmanfm-qt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCManFM-Qt-macos-arm64
          path: PCManFM-Qt-*.dmg
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('macos-{0}', github.run_number) }}
          name: PCManFM-Qt macOS ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build {0}', github.run_number) }}
          files: PCManFM-Qt-*.dmg
          generate_release_notes: true

      - name: Show build logs on failure
        if: failure()
        run: |
          for log in build/CMakeFiles/CMakeError.log build/CMakeFiles/CMakeOutput.log; do
            [ -f "$log" ] && tail -n 200 "$log" || true
          done
